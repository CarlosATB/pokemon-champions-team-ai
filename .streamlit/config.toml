# Visual do site: azul-escuro "premium" com painéis de vidro (CSS em src/visual.py).
[theme]
base = "dark"
backgroundColor = "#121214"
secondaryBackgroundColor = "#1F1F23"
primaryColor = "#5B9BFF"
textColor = "#E7E7EA"
borderColor = "#2E2E33"
showWidgetBorder = true
baseRadius = "medium"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

[client]
# Sem o botão "Deploy" e o menu de desenvolvedor na barra de cima.
toolbarMode = "minimal"

[server]
# Serve a pasta static/ (imagens) em app/static/, para usar as imagens no HTML.
enableStaticServing = true