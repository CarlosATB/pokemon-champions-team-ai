# Visual do site: minimalista, fundo #160D18 com detalhes em #3a0445.
[theme]
base = "dark"
backgroundColor = "#160D18"
secondaryBackgroundColor = "#21142A"
primaryColor = "#9d4bbd"
textColor = "#ECE6EF"
borderColor = "#3a0445"
showWidgetBorder = true

[server]
# Serve a pasta static/ (imagens) em app/static/, para usar as imagens no HTML.
enableStaticServing = true
