# Visual do site: minimalista, fundo azul escuro com detalhes em #3a0445.
[theme]
base = "dark"
backgroundColor = "#0A1428"
secondaryBackgroundColor = "#14213D"
primaryColor = "#9d4bbd"
textColor = "#ECE6EF"
borderColor = "#3a0445"
showWidgetBorder = true

[server]
# Serve a pasta static/ (imagens) em app/static/, para usar as imagens no HTML.
enableStaticServing = true
